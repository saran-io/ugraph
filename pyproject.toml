[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ugraph-kit"
version = "0.1.0"
description = "Build an agent-navigable knowledge base from a YouTube channel. Plain markdown, cited to the second, no database."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saran Santhanam" }]
keywords = ["knowledge-base", "llm", "agents", "obsidian", "youtube", "rag", "okf", "second-brain"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "python-frontmatter>=1.0.0",
    "PyYAML>=6.0",
    # tomllib is stdlib from 3.11; this is the backport for 3.10
    "tomli>=2.0; python_version < '3.11'",
    # Both transcript ingestion and `ugraph person` use the installed executable.
    # Core first use must not require a second package-manager command.
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
# Only needed for `ugraph extract --backend api`. The core, and the local ollama
# backend, stay dependency-free on purpose.
api = ["anthropic>=0.40", "openai>=1.40"]

[project.urls]
Homepage = "https://ugraph.build"
Source = "https://github.com/saran-io/ugraph"
Issues = "https://github.com/saran-io/ugraph/issues"

[project.scripts]
ugraph = "ugraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ugraph"]

# An explicit allow-list, never an exclude-list. The sdist previously inherited
# everything not gitignored, which swept in a 613-file test virtualenv containing an
# absolute symlink to a Python binary — making the archive refuse to extract, and
# `pip install git+https://...` fail outright. Deny-lists fail open; this fails closed.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/ugraph",
    "tests",
    "skills",
    "templates",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "ugraph/_bundled/skills"
"templates" = "ugraph/_bundled/templates"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
# Each of these is a deliberate choice, not debt. Silencing a rule without saying
# why is how a lint config becomes noise nobody reads.
ignore = [
    # Local dates are correct here. A page's `created:` is the author's calendar day,
    # not a UTC instant — a KB written at 9pm in Bengaluru is dated that day, and
    # forcing UTC would file it under tomorrow.
    "DTZ005", "DTZ007", "DTZ011",
    # Bookkeeping and recovery paths deliberately swallow everything: a failed ledger
    # write must not fail an ingest that already succeeded, and a truncated state file
    # must not make a job unstartable. Each site carries a comment saying so.
    "BLE001", "S110",
    # subprocess return codes are inspected explicitly, with the stderr surfaced to
    # the caller. `check=True` would raise past the error handling that exists.
    "PLW1510",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on internals and build deliberately malformed fixtures.
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Several test modules share `scaffold` via `from tests.test_roundtrip import ...`.
# That resolves under `python -m pytest`, which puts the working directory on
# sys.path, and fails under the `pytest` console script, which does not — so the
# suite passed locally and could not even be collected in CI. Set it explicitly
# rather than depending on how pytest happens to be invoked.
pythonpath = ["."]
