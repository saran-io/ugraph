[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ugraph-kit"
version = "0.1.0"
description = "Build an agent-navigable knowledge base from a YouTube channel. Plain markdown, cited to the second, no database."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saran Santhanam" }]
keywords = ["knowledge-base", "llm", "agents", "obsidian", "youtube", "rag", "okf", "second-brain"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "python-frontmatter>=1.0.0",
    "PyYAML>=6.0",
    # tomllib is stdlib from 3.11; this is the backport for 3.10
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/saran-io/ugraph-kit"
Issues = "https://github.com/saran-io/ugraph-kit/issues"

[project.scripts]
ugraph = "ugraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ugraph"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "ugraph/_bundled/skills"
"templates" = "ugraph/_bundled/templates"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
